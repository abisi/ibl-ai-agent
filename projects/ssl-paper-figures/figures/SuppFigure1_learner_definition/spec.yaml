# Supplementary Figure 1 (learner definition) -- learners versus non-learners within each cohort (user 2026-11-18).
# Learner = reference-sheet learning_category good or moderate, non-learner = bad, in both cohorts. The session
# quantifications of Figure 1 and Supplementary Figure 1 (behaviour) on every mouse, learners (solid) versus
# non-learners (dashed / open) within each cohort. R- has only 2 non-learners: shown, never tested.
figure: SuppFigure1_learner_definition
figure_legend:
- {label: R+, color: '#00B400'}
- {label: R−, color: '#C800C8'}
number: S1b
grid:
  width_mm: 183
  n_cols: 5
  col_gap_mm: 7
  row_gap_mm: 11.5
  pad_left_mm: 8
caption:
  title: 'Learner definition: learners and non-learners of each cohort compared on the session measures of Fig. 1 and
    Supplementary Fig. 1.'
  footer: Learners, mice whose reference-sheet learning category is good or moderate; non-learners, category bad (both
    cohorts). Every mouse with a whisker day-0 session is included. Trials with perf = 6 and passive trials are excluded;
    on whisker day 0 the auditory warm-up block is removed except its last trial; early-lick trials are excluded.
    Learners solid lines and filled markers, non-learners dashed lines and open markers; R+, green; R-, magenta;
    auditory, blue; no stimulus, black (R+) and grey (R-). Data are mean ± s.e.m. over mice. Learners versus
    non-learners are compared within each cohort (two-sided Mann-Whitney U tests and Welch's t-tests, both reported,
    uncorrected; cluster-based permutation tests along time), only with at least 3 mice per group (5 per time point for
    clusters); R- has 2 non-learners and is not tested.
shared:
  behaviour_table:
    code: shared_behaviour.load
    calls:
    - behaviour_analysis/behavior_analysis_utils.build_standard_behavior_table
    - behaviour_analysis/behavior_analysis_utils.reindex_whisker_days
    params:
      nwb_dir: NWB_ks4
      auditory_days: all
      trials: perf != 6, not passive, day-0 warm-up cut, no whisker trials on auditory days
