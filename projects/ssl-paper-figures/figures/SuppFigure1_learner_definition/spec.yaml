  key: learners
  title: Learners per cohort
  data: FigS1L_learners.csv
  status: filled
  caption: 'Fraction of mice per reference-sheet learning category (good, moderate: learners; bad: non-learners) among
    mice with a whisker day-0 session; numbers in bars, mice; above, learners/mice. Learner fraction R+ versus R-,
    Fisher''s exact test {stats.fisher_p:p}.'
  cell:
