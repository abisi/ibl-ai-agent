# Supplementary Figure 4 (rastermap validation) -- split from SuppFigure3_rastermap_clustering (user 2026-11-19: panel a of S3
# much bigger, two pages). compute.py / plot.py reuse the SuppFigure3 functions (one source).
# Main run: combined_results_ks4/rastermap_variants/_archive_v1/qc_good_mua__learncat_good_moderate__loc0p25_grid10_nodes__lickfix_longwin
figure: SuppFigure4_rastermap_validation
number: S4
grid:
  width_mm: 183
  n_cols: 5
  col_gap_mm: 7
  row_gap_mm: 11.5
  pad_left_mm: 8
caption:
  title: 'Rastermap clustering: metaclustering, reproducibility, recovery by an independent method, relation
    to latency, hierarchy and areas, robustness.'
  footer: Neurons, good and multi-unit clusters of learner mice (reference-sheet learning category good or moderate),
    whisker learning day (day 0), one session per mouse (rastermap variant qc_good_mua__learncat_good_moderate__loc0p25_grid10_nodes__lickfix_longwin). Rastermap (locality 0.25, 10x grid upsampling) was fitted on the
    concatenated baseline-subtracted PSTHs of odd trials (passive whisker / auditory pre and post, active stimulus- and
    lick-aligned conditions) and cut into 100 clusters in rastermap order; metaclusters are contiguous groups of those
    clusters (average linkage on 1 - Pearson r between full-trial cluster-mean PSTHs, merges only between neighbouring
    clusters, cut at 1 - r = 0.40).
shared:
  rastermap_run:
    code: rastermap_psth.population_matrix_summary (load_rastermap, metaclustering, _cluster_means, family_names_psth)
    calls:
    - unit_spikes_analysis/rastermap_psth/run_clustering_new.run_rastermap (CV fit, results)
    params:
      variant: qc_good_mua__learncat_good_moderate__loc0p25_grid10_nodes__lickfix_longwin
      clusters: 100, fit on odd trials, PSTHs shown on even trials
      metaclustering: contiguous, average linkage, 1 - r, cut 0.40
  gmm:
    code: ssl-rastermap-psth-variants/exploratory-analyses/046_bgmm_main_variant.py (spectral embedding),
      047_bgmm_fixed_k.py (K = 100 GMM on that embedding, bgmm_k100_labels.csv); GMM families and matching in
      SuppFigure3 compute._gmm_families
    calls:
    - unit_spikes_analysis/rastermap_psth/gmm_utils_new (method and defaults of run_gmm)
    params:
      matrix: X_odd (as rastermap)
      spectral: 13 dimensions, sigma tuned to mean similarity 0.5, N_PCA by permutation test
      gmm: K = 100, diagonal, maximum likelihood (96 components used)
      families: components < smallest rastermap cluster dropped; average linkage on 1 - r of component-mean PSTHs
        (full trials), no contiguity constraint, cut to the number of metaclusters
      matching: Hungarian on Pearson r of family-mean PSTHs (held-out even trials, population mean kept)
figure_key:
- "Abbreviations. PSTH, peri-stimulus time histogram (trial-averaged firing rate); GMM, Gaussian mixture model; AMI, adjusted mutual information; KL, Kullback-Leibler divergence; r, Pearson correlation; ρ, Spearman rank correlation; p, permutation p-value; pct., percentile; n.s., not significant; s.e.m., standard error of the mean. Rastermap order: position of a cluster along the one-dimensional rastermap embedding (1-100); odd / even trials: fitting / held-out halves."
- "Areas (h). AUD, auditory areas; FRP, frontal pole; ORB, orbitofrontal cortex; mPFC, medial prefrontal cortex; CA1 / CA3, hippocampal fields CA1 / CA3; AI, agranular insula; LSX, lateral septal complex; PAG, periaqueductal grey; SCm / SCs, superior colliculus, motor / sensory layers; RN, red nucleus; MRN, midbrain reticular nucleus; MB, midbrain (other); MO-tjM1, tongue-jaw primary motor cortex; MO-ALM, anterior lateral motor cortex; MO-wM1 / MO-wM2, whisker primary / secondary motor cortex; OLF, olfactory areas; GPe, globus pallidus, external segment; PPC, posterior parietal cortex; RSP, retrosplenial cortex; SSp-oro, primary somatosensory cortex, mouth and nose; SSp-bfd, primary somatosensory cortex, barrel field; SSs, secondary somatosensory cortex; VS, ventral striatum; DMS / DLS, dorsomedial / dorsolateral striatum; TS, tail of the striatum; RT, reticular thalamic nucleus; ILN, midline and intralaminar thalamic nuclei; VT, ventral thalamic nuclei; LGN, lateral geniculate nucleus; V1, primary visual cortex."
