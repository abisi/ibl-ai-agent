# Supplementary Figure 4 (rastermap validation) -- split from SuppFigure3_rastermap_clustering (user 2026-11-19: panel a of S3
# much bigger, two pages). compute.py / plot.py reuse the SuppFigure3 functions (one source).
# Main run: combined_results_ks4/rastermap_variants/qc_good_mua__learncat_good_moderate__loc0p25_grid10_nodes__lickfix_longwin
figure: SuppFigure4_rastermap_validation
number: S4
grid:
  width_mm: 183
  n_cols: 5
  col_gap_mm: 7
  row_gap_mm: 11.5
  pad_left_mm: 8
caption:
  title: 'Rastermap clustering: metaclustering, reproducibility, recovery by an independent method, relation
    to latency, hierarchy and areas, robustness.'
  footer: Neurons, good and multi-unit clusters of learner mice (reference-sheet learning category good or moderate),
    whisker learning day (day 0), one session per mouse (rastermap variant qc_good_mua__learncat_good_moderate__loc0p25_grid10_nodes__lickfix_longwin). Rastermap (locality 0.25, 10x grid upsampling) was fitted on the
    concatenated baseline-subtracted PSTHs of odd trials (passive whisker / auditory pre and post, active stimulus- and
    lick-aligned conditions) and cut into 100 clusters in rastermap order; metaclusters are contiguous groups of those
    clusters (average linkage on 1 - Pearson r between full-trial cluster-mean PSTHs, merges only between neighbouring
    clusters, cut at 1 - r = 0.40).
shared:
  rastermap_run:
    code: rastermap_psth.population_matrix_summary (load_rastermap, metaclustering, _cluster_means, family_names_psth)
    calls:
    - unit_spikes_analysis/rastermap_psth/run_clustering_new.run_rastermap (CV fit, results)
    params:
      variant: qc_good_mua__learncat_good_moderate__loc0p25_grid10_nodes__lickfix_longwin
      clusters: 100, fit on odd trials, PSTHs shown on even trials
      metaclustering: contiguous, average linkage, 1 - r, cut 0.40
  bgmm:
    code: ssl-rastermap-psth-variants/exploratory-analyses/046_bgmm_main_variant.py (embedding + Dirichlet-process
      GMM), 047_bgmm_fixed_k.py (fixed K = 100 / 24 on the same embedding, maximum likelihood)
    calls:
    - unit_spikes_analysis/rastermap_psth/gmm_utils_new (method and defaults of run_gmm)
    params:
      matrix: X_odd (as rastermap)
      spectral: 13 dimensions, sigma tuned to mean similarity 0.5, N_PCA by permutation test
      bgmm: 200 components, Dirichlet process, concentration 1, diagonal, 10 inits
