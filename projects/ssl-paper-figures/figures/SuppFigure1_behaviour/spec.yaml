# Supplementary Figure 1 -- behavioural characterisation (user 2026-11-18: reorganised by theme; learner definition moved to its
# own supplementary figure): days and false alarms | d' over trials and session time | curve correlations | first lick,
# auditory RT, history | behavioural GLM (moved from Figure 1, user 2026-11-22). Evoked movements moved to
# SuppFigure1_movements (S1c, user 2026-11-22: tongue and lick-aligned traces added).
# Same data and conventions as Figure1_behaviour (shared behaviour table, cohort and learner labels from the reference
# sheet, mean +- s.e.m. over mice, R+ vs R- Mann-Whitney and Welch, both reported).
figure: SuppFigure1_behaviour
figure_legend:  # top-right R+ / R- key (user 2026-11-16)
- {label: R+, color: '#00B400'}
- {label: R−, color: '#C800C8'}
number: S1
grid:
  width_mm: 183
  n_cols: 5
  col_gap_mm: 7
  row_gap_mm: 11.5
  pad_left_mm: 8
caption:
  title: 'Behavioural characterisation: pretraining, performance across days, d'' across the session, curve correlations,
    trial history and the behavioural GLM.'
  footer: Trials with perf = 6 and passive trials are excluded; on whisker day 0 the auditory warm-up block is removed except
    its last trial; early-lick trials are excluded. R+, green; R-, magenta; auditory, blue; no stimulus, black (R+) and grey
    (R-). Unless stated otherwise, data are mean ± s.e.m. over mice and R+ versus R- comparisons are two-sided Mann-Whitney
    U tests and Welch's t-tests, both reported, without correction for multiple comparisons. Significance (user 2026-11-22),
    * P < 0.05, ** P < 0.01, *** P < 0.001, n.s. otherwise, with the P value written above the stars.
shared:
  behaviour_table:
    code: shared_behaviour.load
    calls:
    - behaviour_analysis/behavior_analysis_utils.build_standard_behavior_table
    - behaviour_analysis/behavior_analysis_utils.reindex_whisker_days
    params:
      nwb_dir: NWB_ks4
      auditory_days: all
      trials: perf != 6, not passive, day-0 warm-up cut, no whisker trials on auditory days
