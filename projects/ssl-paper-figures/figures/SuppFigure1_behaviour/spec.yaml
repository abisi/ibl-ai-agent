# Supplementary Figure 1 -- behavioural characterisation (user 2026-11-18: reorganised by theme; learner definition moved to its
# own supplementary figure): days and false alarms | d' over session time | curve correlations | first lick, auditory RT,
# history | evoked movements on every trial type.
# Same data and conventions as Figure1_behaviour (shared behaviour table, cohort and learner labels from the reference
# sheet, mean +- s.e.m. over mice, R+ vs R- Mann-Whitney and Welch, both reported).
figure: SuppFigure1_behaviour
figure_legend:  # top-right R+ / R- key (user 2026-11-16)
- {label: R+, color: '#00B400'}
- {label: R−, color: '#C800C8'}
number: S1
grid:
  width_mm: 183
  n_cols: 5
  col_gap_mm: 7
  row_gap_mm: 11.5
  pad_left_mm: 8
caption:
  title: 'Behavioural characterisation: pretraining, performance across days, d'' across the session, curve correlations,
    trial history and evoked movements.'
  footer: Trials with perf = 6 and passive trials are excluded; on whisker day 0 the auditory warm-up block is removed except
    its last trial; early-lick trials are excluded. R+, green; R-, magenta; auditory, blue; no stimulus, black (R+) and grey
    (R-). Unless stated otherwise, data are mean ± s.e.m. over mice and R+ versus R- comparisons are two-sided Mann-Whitney
    U tests and Welch's t-tests, both reported, without correction for multiple comparisons.
shared:
  behaviour_table:
    code: shared_behaviour.load
    calls:
    - behaviour_analysis/behavior_analysis_utils.build_standard_behavior_table
    - behaviour_analysis/behavior_analysis_utils.reindex_whisker_days
    params:
      nwb_dir: NWB_ks4
      auditory_days: all
      trials: perf != 6, not passive, day-0 warm-up cut, no whisker trials on auditory days
panels:
- id: a
  key: pretraining
  title: Auditory pretraining
  data: FigS1_pretraining.csv
  status: filled
  caption: Number of auditory pretraining trials per mouse (all auditory days before whisker day 0). Bars, mean ± s.e.m. over
    mice; dots, mice. Mann-Whitney {stats.mannwhitney_p:p}, Welch {stats.welch_p:p}. n = {n.R+.mice} R+ and {n.R-.mice} R-
    learner mice.
  cell:
    x_mm: 0.0
    y_mm: 0.0
    w_mm: 20.0
    h_mm: 34.0
- id: b
  key: day0_closeup
  title: Day 0 lick probability per mouse
  data: FigS1_day0_closeup.csv
  status: filled
  caption: Lick probability on whisker (W), auditory (A) and no-stimulus trials (FA) of whisker day 0, one dot per mouse,
    R+ next to R-; black-edged dot, mean ± s.e.m. over mice. Asterisks, Mann-Whitney R+ versus R- (P < 0.05). Whisker, Mann-Whitney
    {stats.whisker_trial.mannwhitney_p:p}, Welch {stats.whisker_trial.welch_p:p}; auditory, Mann-Whitney {stats.auditory_trial.mannwhitney_p:p},
    Welch {stats.auditory_trial.welch_p:p}; false alarms, Mann-Whitney {stats.no_stim_trial.mannwhitney_p:p}, Welch {stats.no_stim_trial.welch_p:p}.
    n = {n.R+.mice} R+ and {n.R-.mice} R- learner mice.
  cell:
    x_mm: 24.0
    y_mm: 0.0
    w_mm: 40.0
    h_mm: 34.0
- id: c
  key: cumulative_fa
  title: False alarms on day -1 and day 0
  data: FigS1_cumulative_fa.csv
  status: filled
  calls:
  - Figure1_behaviour/compute.compute_cumulative_fa (anchors as behaviour_analysis beh_plotting_functions.plot_cumulative_fa_vs_whisker_trials)
  params:
    n_trials: 30
    mice: learners
  caption: 'Cumulative false alarms after an anchor on whisker day 0 (solid; per whisker trial after the first licked whisker
    trial, untrimmed session) and on auditory day -1 (dashed; per no-stimulus trial after the trial at which the mouse had
    received as many auditory rewards as at its day-0 anchor), mean ± s.e.m. over learner mice; R+ black, R- grey. At
    {n_trials} trials, R+ versus R-: day 0 Mann-Whitney {stats.day0.mannwhitney_p:p}, Welch {stats.day0.welch_p:p}; day -1
    Mann-Whitney {stats.day-1.mannwhitney_p:p}, Welch {stats.day-1.welch_p:p}. Day 0 versus day -1 within mouse (Wilcoxon):
    R+ {day0_vs_daym1.R+.wilcoxon_p:p} ({day0_vs_daym1.R+.n} mice), R- {day0_vs_daym1.R-.wilcoxon_p:p}
    ({day0_vs_daym1.R-.n} mice). n = {n.day0.R+.mice} R+ and {n.day0.R-.mice} R- learner mice on day 0.'
  cell:
    x_mm: 69.0
    y_mm: 0.0
    w_mm: 34.0
    h_mm: 34.0
