# Figure 4, rows 3+ (user's part; rows 1-2 = panels A-G of the colleague): passive whisker responses on the hit - miss coding
# direction. User 2026-11-23: one clean pipeline (ssl-hitmiss-axis-passive 179_cd_clean.py); session selection reconciled
# with A-G (132 session_trials fix, AB144 back, >= 3 hits and misses). v2 (same day, "the figures are not great"; "check
# cosyne figures"): COSYNE 2027 layout (Posters/cosyne_2027 rows O-S) + the angle, gain / rotation, areas vs response
# change and across days. Code: shared_passive_cd.py. Letters continue A-G.
figure: Figure4_passive_cd
number: '4'
grid:
  width_mm: 183
  n_cols: 5
  col_gap_mm: 7
  row_gap_mm: 11.5
  pad_left_mm: 8
caption:
  title: 'After the task, passive whisker responses of R− mice rotate away from the hit − miss coding direction.'
  footer: Neurons, stable good and multi-unit clusters (stable across the session by presence, coverage and drift tests);
    learner mice (reference-sheet learning category good or moderate), whisker day 0, one session per mouse, unless stated.
    Trials selected with ephys_utilities (active trials with the particle detector off removed; passive epochs = the passive
    blocks before and after the active block, licked passive trials removed, at least 5 passive trials per modality).
    Responses, spike rate 5-35 ms after stimulus onset minus the trial's own baseline (-1 s to -15 ms), divided by each
    neuron's s.d. over the active trials + 6 spikes/s (noise normalisation). Hit − miss axis, unit vector of the mean whisker
    hit minus mean whisker miss response over the active whisker trials (at least 3 of each; last 10 % of the active block
    removed); passive trials never contribute to it. Projections per neuron (divided by the square root of the number of
    neurons). Linear shifts (open markers; data − shifted), 50 axes built from hit / miss labels linearly shifted by 10-50 %
    of the whisker trials (non-wrapping), averaged. R+, green; R−, magenta; whisker, yellow; auditory, blue. Data are mean ±
    s.e.m. over sessions (mice where stated). R+ versus R−, two-sided Mann-Whitney U and Welch's t-tests; pre versus post,
    Wilcoxon signed-rank and paired t-tests; both computed, the larger P value shown (* P < 0.05, ** P < 0.01, *** P <
    0.001, n.s.), uncorrected.
shared:
  cd_tables:
    code: shared_passive_cd.clean / whole
    calls:
    - ssl-hitmiss-axis-passive/exploratory-analyses/179_cd_clean.py (learning and SSL_STAGE=expert)
    - ssl-hitmiss-axis-passive/exploratory-analyses/132_modality_stim_passive_active.session_trials
    - ssl-whisker-hitmiss-timeresolved-decoding/exploratory-analyses/137b_tracked_units.py
    params:
      window: 5-35 ms; baseline -55 to -20 ms
      min_hits_misses: 3
      shifts: 50, 10-50 %, non-wrapping
      learners: reference sheet learning_category good / moderate
# v3 (user 2026-11-25, panel by panel): three sections with full-width grey titles (build.py figure_sections): whole brain
# (schematic from Figma, zoomed time course, state space in the passive-pre plane, projection whisker | auditory with the
# cohort x modality test, geometric decomposition a = rho cos theta with strength and angle, whisker | auditory), areas on the
# whole-brain axis (202: share, per-neuron, enrichment), learning curves (R+ / R- examples, trial types x curves, areas).
# Moved to supp: angle pre / post (now the decomposition's angle), per-area axes (old N), area link (old O), across days
# (old P), orthogonalisation (old Q). Data - shifted throughout unless stated.
sections:
- title: "Passive sensory responses before and after the task (rebuilt on the H–S pipeline)"
  y_mm: 0.0
- title: "Relative to the hit − miss coding direction: R− passive whisker responses rotate away after the task"
  y_mm: 75.0
- title: "Learning: active trials on the hit − miss axis track the whisker learning curve"
  y_mm: 169.0
- title: "Expert days: the passive change on the learning day versus expert days"
  y_mm: 215.0
