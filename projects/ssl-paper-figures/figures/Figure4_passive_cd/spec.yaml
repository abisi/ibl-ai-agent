    display only) to whisker and
    auditory stimuli before (pre) and after (post) the task; 1-ms bins, causal 5-ms boxcar (stride 1 ms), z-scored per
    neuron across the four conditions (s.d. over all time bins of the four conditions, zero at the neuron's pre-stimulus
    mean); neurons ordered by the pre-task whisker response (5-35 ms, the evoked-response window of F), displayed in blocks
