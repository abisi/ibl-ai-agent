- id: k
  key: glm_weights_auc
  title: Behavioural GLM of whisker licking
  data: Fig1_glm_weights_auc.csv
  status: filled
  calls:
  - glm_v7 lick head (weights, single-predictor drop-and-refit)
  - glm_v7_groups.py (user 2026-11-23, group drop-and-refit; reward, movement, history)
  caption: 'Left, GLM weights (L2-regularised logistic regression of licking on the whisker trials of whisker day 0,
    standardised predictors; mean over folds and repeats; positive, more licking when the predictor is high). Right,
    held-out log-likelihood per trial (nats) of the full model minus that of the model refitted without the predictor
    (cohort colours; positive, the predictor improves the held-out prediction), and without a group of predictors removed
    together (right column; diamonds in the cohort colours, at the centre of the group''s predictors; groups on the right axis):
    reward history (cumulative reward fraction, time since reward), movement (pre-stimulus whisker, nose and jaw speed,
    pupil area) and lick history (licks on the three previous whisker trials, spontaneous lick rate). Cross-validation: 5
    contiguous blocks of whisker trials (3 whisker trials on each side of the test block left out of training; one L2
    penalty per session, the one maximising the held-out log-likelihood of all other sessions), repeated 10 times with
    shifted block boundaries; scores are the mean over repeats. Mean ± s.e.m. over mice. Filled markers, different from
