    n = {rt_change.n.R+.mice} R+ and {rt_change.n.R-.mice} R- learner mice. Right, Spearman correlation between reaction time and the whisker learning curve
    across the licked trials of each mouse (whisker hits, auditory hits, false alarms; curve at the trial or the preceding
