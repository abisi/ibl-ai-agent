# Figure 1 -- behaviour. Layout from the figure planner (2026-11-10 read: e/f without states, g with lag-0 bars, i binned, k lineplot): 15 panels in 4 rows (2026-11-10: aligned_curves dropped, spontaneous licks merged into i with whisker and auditory; j perf_session, k rt_learning, l-o GLM) inside 183 x 167 mm (2026-11-09: movement to d, pretraining to SuppFigure1_behaviour)
# (Nature double column, full-page depth; fills the A4 page, user 2026-11-05); each box (mm, x from the left edge, y from the top) is a whole panel.
# `key` is the panel's stable name (compute_<key>, plot_<key>, data Fig1_<key>.csv); `id` is its letter in this layout.
# Learning-curve-dependent panels use the exact re-fit (learning_curve_exact, sigma 1, 80% CI; user 2026-11-02).
# Learner / non-learner = reference sheet learning_category (good, moderate = learner; bad = non-learner; user 2026-11-02).
# DLC: ephys_utilities dlc_helpers only (user rule 2026-11-05). Style (planner notes): mean +- s.e.m. in cohort colours,
# individual mice only where asked; auditory blue (lighter for R-); false alarms black (R+) and grey (R-).
figure: Figure1_behaviour
number: '1'
grid:
  width_mm: 183
  n_cols: 5
  col_gap_mm: 7
  row_gap_mm: 11.5
  pad_left_mm: 8
caption:
  title: 'Auditory-to-whisker transfer learning: task, within-session learning dynamics, correlates of learning and a behavioural
    model.'
  footer: Trials with perf = 6 and passive trials are excluded; on whisker day 0 the auditory warm-up block is removed except
    its last trial; early-lick trials are excluded. Reaction time is the first-lick time from the start of the response
    window. Cohort (R+, whisker hits rewarded; R-, whisker hits not rewarded) is assigned per mouse from the reference sheet.
    R+, green; R-, magenta; auditory, blue; no stimulus, black. Unless stated otherwise, data are mean ± s.e.m. over mice
    and R+ versus R- comparisons are two-sided Mann-Whitney U tests and Welch's t-tests, both reported, without correction
    for multiple comparisons.
shared:
  behaviour_table:
    code: shared_behaviour.load
    calls:
    - behaviour_analysis/behavior_analysis_utils.build_standard_behavior_table
    - behaviour_analysis/behavior_analysis_utils.reindex_whisker_days
    params:
      nwb_dir: NWB_ks4
      auditory_days: all
      whisker_days:
      - 0
      - 1
      - 2
      - 3
      trials: perf != 6, not passive, day-0 warm-up cut, no whisker trials on auditory days
      reaction_time: recomputed after reindex_whisker_days
  day0_curves:
    code: compute.day0_curves
    calls:
    - ssl-paper-figures/learning_curve_exact.session_learning_curves_exact (vendored; learning trial by behaviour_analysis/learning_utils.identify_learning_trial_*)
    params:
      sigma: 1.0
      conf_int: 80
      trials: whisker day 0, early_lick == 0
      chance: no-stim curve interpolated in time onto whisker trials
  learner_label:
    code: shared_behaviour.mouse_reference
    params:
      source: dataset_info/joint_mouse_reference_weight.xlsx learning_category
      learner:
      - good
      - moderate
      non_learner:
      - bad
  perf_states:
    code: compute.perf_states
    calls:
    - behaviour_analysis/learning_utils.assign_expertise_blocks
    - behaviour_analysis/learning_utils.propagate_expertise_inplace
    params:
      n_consecutive: 5
      criterion: 'R+: p_low > p_chance; R-: p_low < p_chance (as in the repo; confirmed by the user 2026-11-02)'
      low_sated: after a high block, p_mean < 0.2 and p_chance < 0.1 to the session end
      curves: day0_curves
  glm_v5:
    code: glm_v5_run.py (user 2026-11-09)
    changes_from_glm_v4: 5 contiguous outer blocks (default) instead of 10; drop-and-refit importance (delta held-out
      log-likelihood per trial when a predictor group is removed and the model refitted at the fold's C), next to the
      shuffled-predictor delta AUC; metrics = mean over the 10 repeats of the pooled held-out scores; example trace = per-trial
      mean of the 10 held-out predictions
  glm_v4:
    code: glm_v4_run.py (user 2026-11-09; design matrix from glm_v3_run.glm_module, Myriam's file unchanged)
    changes_from_glm_v3: contiguous-block CV with a 3-whisker-trial gap, 10 repeats with shifted blocks; no class weighting (calibrated probabilities); C by log-loss on 1e-5..1e3; balanced accuracy at the training lick rate; metrics pooled per repeat, mean over repeats
  glm_v3:
    code: glm_v3_run.py (wrapper; Myriam's file unchanged, run from a patched copy)
    calls:
    - behaviour_analysis/glm_behavior/glm_behavior_v3.process_one_mouse
    params:
      settings: 'her __main__ defaults: bin 0.2 s, pre-stim window -0.2..0 s, 10 CV folds, RT head, nested comparison, shuffle
        importance 10 repeats, whole session'
      mice: reference-sheet learners
      predictors: lick n-1..n-3, spontaneous lick rate, time since reward, cumulative reward fraction, jaw/nose/whisker
        speed, pupil area (pre-stimulus)
      nose_speed: '|nose_velocity|, side view only (user 2026-11-05; her code combines side and top views, which fails for
        sessions without the top view)'
      sessions: session NWBs only (*_backup_<date>.nwb excluded, 2026-11-05)
  movements:
    code: shared_movements.load (dlc_helpers)
    calls:
    - NWB_reader/NWB_reader_functions.get_dlc_data_dict
    params:
      mice: with_dual_view == 1
      metrics: motion energy (mean |diff|) of jaw_distance, nose_norm_distance, whisker_angle in [-0.2, 0) s; mean pupil_area
        in [-2, 0) s
  movement_peth:
    code: shared_movement_peth.load (dlc_helpers)
    calls:
    - NWB_reader/NWB_reader_functions.get_dlc_data_dict
    params:
      mice: with_dual_view == 1
      version: 5
      signals: whisker speed (-0.05..0.1 s), jaw_distance (-0.1..0.3 s), pupil_area (-1..3 s), physical units
      split: trial type x lick / no lick; aligned at the stimulus and at the lick (start_time + computed_reaction_time)
      normalisation: minus each trial's pre-stimulus mean (both alignments)
