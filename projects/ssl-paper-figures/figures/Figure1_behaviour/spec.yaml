    R- {stats_rho.whisker_trial.R-_vs_0.wilcoxon_p:p}; R+ versus R- Mann-Whitney {stats_rho.whisker_trial.rplus_vs_rminus.mannwhitney_p:p},
    Welch {stats_rho.whisker_trial.rplus_vs_rminus.welch_p:p}. n = {n.R+.mice} R+ and {n.R-.mice} R- learner mice.'
  cell:
