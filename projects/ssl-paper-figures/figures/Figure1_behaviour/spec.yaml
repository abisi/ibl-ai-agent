    Spontaneous licks: {spont_licks.bins_sig_after_hit} of {spont_licks.bins_after_hit} bins after the hit differ; before
    the hit the cohorts do not differ (Mann-Whitney {spont_licks.prepost.R+ vs R- pre.mannwhitney_p:p}, Welch {spont_licks.prepost.R+
    vs R- pre.welch_p:p}); from before to after the hit (0 to 5 min), R+ goes from {spont_licks.pre_post.R+.pre_mean:.1f}
