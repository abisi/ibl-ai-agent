    Welch {rt_change.slope.rplus_vs_rminus.welch_p:p}. Trial-based slope (linear mixed model of the change
    on hit number over single hits, random intercept and slope per mouse, REML): R+ {rt_change.lmm.R+.slope:+.0f} ± {rt_change.lmm.R+.se:.0f}
    ms per 10 hits ({rt_change.lmm.R+.p:p}; {rt_change.lmm.R+.n_trials} hits), R- {rt_change.lmm.R-.slope:+.0f} ± {rt_change.lmm.R-.se:.0f}
    ms ({rt_change.lmm.R-.p:p}; {rt_change.lmm.R-.n_trials} hits); cohort × hit-number interaction {rt_change.lmm.rplus_vs_rminus.slope:+.0f}
    ± {rt_change.lmm.rplus_vs_rminus.se:.0f} ms ({rt_change.lmm.rplus_vs_rminus.p:p}). Coloured bars, hits after the first where a cohort differs from 0
