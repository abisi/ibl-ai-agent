    bins after the hit differ (minutes {whisker.sig_minutes_text}); before the hit lick probability is 0 by definition
    (all misses), so whisker trials are not tested against the pre window; from 0 to 5 min, R+ {whisker.pre_post.R+.post_mean:.2f}
    ± {whisker.pre_post.R+.post_sem:.2f} and R- {whisker.pre_post.R-.post_mean:.2f} ± {whisker.pre_post.R-.post_sem:.2f}
