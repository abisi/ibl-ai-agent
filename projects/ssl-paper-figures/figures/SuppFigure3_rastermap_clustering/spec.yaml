  image: _cache/suppfig3_metaclusters_1200dpi.png
  calls: ssl-rastermap-psth-variants/exploratory-analyses/045_metacluster_description.py --order 17 15 16 9 20 21 --name supp_metaclusters
  caption: The six largest metaclusters not shown in Fig. 2, as in Fig. 2 (PSTHs on even trials, mean ± s.e.m. over
