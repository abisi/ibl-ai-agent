# Supplementary Figure 3 (rastermap clustering) -- user 2026-11-19: the metaclusters not shown in Figure 2, the
# details of the metaclustering, and the rastermap
# position of the fine clusters against onset latency and cortical hierarchy. Planner: figures/SuppFigure3_rastermap_clustering.
# Main run: combined_results_ks4/rastermap_variants/_archive_v1/qc_good_mua__learncat_good_moderate__loc0p25_grid10_nodes__lickfix_longwin
figure: SuppFigure3_rastermap_clustering
number: S3
grid:
  width_mm: 183
  n_cols: 5
  col_gap_mm: 7
  row_gap_mm: 11.5
  pad_left_mm: 8
caption:
  title: 'Rastermap clustering: remaining metaclusters and population structure.'
  footer: Neurons, good and multi-unit clusters of learner mice (reference-sheet learning category good or moderate),
    whisker learning day (day 0), one session per mouse (rastermap variant qc_good_mua__learncat_good_moderate__loc0p25_grid10_nodes__lickfix_longwin). Rastermap (locality 0.25, 10x grid upsampling) was fitted on the
    concatenated baseline-subtracted PSTHs of odd trials (passive whisker / auditory pre and post, active stimulus- and
    lick-aligned conditions) and cut into 100 clusters in rastermap order; metaclusters are contiguous groups of those
    clusters (average linkage on 1 - Pearson r between full-trial cluster-mean PSTHs, merges only between neighbouring
    clusters, cut at 1 - r = 0.40).
shared:
  rastermap_run:
    code: rastermap_psth.population_matrix_summary (load_rastermap, metaclustering, _cluster_means, family_names_psth)
    calls:
    - unit_spikes_analysis/rastermap_psth/run_clustering_new.run_rastermap (CV fit, results)
    params:
      variant: qc_good_mua__learncat_good_moderate__loc0p25_grid10_nodes__lickfix_longwin
      clusters: 100, fit on odd trials, PSTHs shown on even trials
      metaclustering: contiguous, average linkage, 1 - r, cut 0.40
